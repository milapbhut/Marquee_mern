<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        .container{
            hight: 1000px;
            width: 1000px;
            background-color: rgb(255, 170, 170);
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(5, 100px);
            grid-template-rows: repeat(3, 100px);
        }
        .item1{
            background-color: aqua;
            grid-column: span 2;
        }
        .item2{
            background-color: rgb(173, 255, 255);
        }
        .item3{
            background-color: rgb(173, 255, 173);
            grid-column: span 2;
        }
        .item4{
            background-color: rgb(255, 255, 173);
            grid-column: span 3;
        }
        .item5{
            background-color: rgb(158, 104, 104);
        }
        .item6{
            background-color: rgb(173, 173, 255);
        }
        .item7{
            background-color: rgb(255, 173, 255);
            grid-column: span 2;
        }
        .item8{
            background-color: rgb(137, 127, 127);
            grid-column: span 2;
        }
        .item9{
            background-color: rgb(173, 255, 255);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
        <div class="item7">7</div>
        <div class="item8">8</div>
        <div class="item9">9</div>
    </div>
</body>
</html>
