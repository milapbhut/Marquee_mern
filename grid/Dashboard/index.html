<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="sidenav">
            <div class="title">
                <div class="title_text">
                    <h1>Afghan Product</h1>
                    <h3>Admin Panel</h3>
                </div>
                <div class="title_icon">
                    <i class="fa-solid fa-x" style="color: rgb(255, 255, 255);"></i>
                </div>
            </div>
            <div class="items">
                <div class="sidebar_label" id="active">
                    <div class="sidebar_label_icon"><i class="fa-solid fa-table-cells-large" style="color: rgb(255, 255, 255);"></i>
                    </div>
                    <div class="sidebar_label_text">Dashboard</div>
                </div>
                <div class="sidebar_label">
                    <div class="sidebar_label_icon"><i class="fa-solid fa-user-group" style="color: rgb(255, 255, 255);"></i></div>
                    <div class="sidebar_label_text">Users</div>
                </div>
                <div class="sidebar_label">
                    <div class="sidebar_label_icon"><i class="fa-solid fa-box-open" style="color: rgb(255, 255, 255);"></i></div>
                    <div class="sidebar_label_text">Products</div>
                </div>
                <div class="sidebar_label">
                    <div class="sidebar_label_icon"><i class="fa-solid fa-bag-shopping" style="color: rgb(255, 255, 255);"></i></div>
                    <div class="sidebar_label_text">Orders</div>
                </div>
                <div class="sidebar_label">
                    <div class="sidebar_label_icon"><i class="fa-solid fa-table-cells-large" style="color: rgb(255, 255, 255);"></i>
                    </div>
                    <div class="sidebar_label_text">Categories</div>
                </div>
                <div class="sidebar_label">
                    <div class="sidebar_label_icon"><i class="fa-regular fa-envelope" style="color: rgb(255, 255, 255);"></i></div>
                    <div class="sidebar_label_text">Messages</div>
                </div>
                <div class="sidebar_label">
                    <div class="sidebar_label_icon"><i class="fa-solid fa-arrow-trend-up" style="color: rgb(255, 255, 255);"></i></div>
                    <div class="sidebar_label_text">Analytics</div>
                </div>
                <div class="sidebar_label">
                    <div class="sidebar_label_icon"><i class="fa-solid fa-gear" style="color: rgb(255, 255, 255);"></i></div>
                    <div class="sidebar_label_text">Settings</div>
                </div>
            </div>
            <div class="sidebar_label_admin">
                <div class="sidebar_label_admin_icon"><i class="fa-solid fa-user-tie"></i></div>
                <div class="sidebar_label_admin_text">
                    <h2>Admin User</h2>
                    <p>admin@afghan.com</p>
                </div>
            </div>
        </div>
        <div class="header">
            <div class="header_left_text">
                <h1>Dashboard</h1>
                <p>Manage and dashboard here</p>
            </div>
            <div class="header_right_profile">
                <div class="header_search">
                    <i class="fa-solid fa-magnifying-glass""></i>
                    <input type="text" name="search" id="#" placeholder="Search...">
                </div>
                <div class="header_notification">
                    <i class="fa-regular fa-bell"></i>
                </div>
                <div class="header_profile">
                    <div class="profile_icon"><i class="fa-solid fa-a"></i></div></div>
            </div>
        </div>
        <div class="main">
            <div class="welcom_panale">
                <div class="welcom_panale_text">
                    <div class="welcom_panale_admin">
                        <h1>Welcom back, Admin</h1>
                        <p>Here's your platform performance overview</p>
                    </div>
                    <div class="welcom_panale_day">
                        <h3>Wednasday, April 1,2026</h3>
                    </div>
                    <div class="welcom_panale_export">
                        <div class="export">
                            <i class="fa-solid fa-arrow-down"></i>
                            <h3>Export</h3>
                        </div>
                        <div class="reload">
                            <i class="fa-solid fa-rotate"></i>
                        </div>
                    </div>
                </div>
                <div class="welcom_panale_cards">

                </div>
            </div>
        </div>
</body>
</html>
